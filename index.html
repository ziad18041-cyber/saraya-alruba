<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;height:100%}[hidden]{display:none!important}</style></head><body>
<title>خريطة سرايا الربى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Lalezar&display=swap">
<style>
/* Concept: a San Andreas gang-turf pause map laid over real Riyadh boundaries.
   Map fills the screen; the side panel is the pause-menu sheet (bottom sheet on phones). */
:root{
  --ground:#18242c; --ground2:#22323b; --sheet:#101a20; --line:#32454f;
  --road:#d5dcd8; --casing:#0a1115; --ink:#eef1ec; --dim:#93a4a8;
  --gold:#f3c548; --health:#58b368; --wasted:#c9413a;
  --t1:#2e9c94; --t2:#8aa83f; --t3:#dc9a2e; --t4:#d9652f; --t5:#d23c36;
  --display:"Lalezar","IBM Plex Sans Arabic",sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;direction:rtl}
.map{position:relative;overflow:hidden;direction:ltr;touch-action:none;cursor:grab;
  background:radial-gradient(ellipse at 45% 55%,var(--ground2),var(--ground) 72%);user-select:none;-webkit-user-select:none}
.map.drag{cursor:grabbing}
.map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gl svg{width:14px;height:14px;fill:#fff}
.d{cursor:pointer;vector-effect:non-scaling-stroke}
.casing{fill:none;stroke:var(--casing);stroke-width:5;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.road{fill:none;stroke:var(--road);stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.turf{opacity:.62;transition:opacity .15s}
.g.on .turf{opacity:.95}
.g.on .road{stroke:#fff;stroke-width:3}
.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 7;vector-effect:non-scaling-stroke}
.lead{stroke:var(--ink);stroke-width:1;opacity:.55;vector-effect:non-scaling-stroke}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:auto;direction:rtl;text-align:center;line-height:1.1;
  transform-origin:center;white-space:nowrap;padding:3px 5px;background:#0a1115c4}
.tag b{display:block;font:400 19px/1.05 var(--display);color:#fff;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 2px 0 #000}
.bar{display:block;height:6px;width:64px;margin:3px auto 2px;background:#0d1417;border:1px solid #000;direction:ltr}
.bar i{display:block;height:100%;background:var(--wasted)}
.st{display:block;font-size:12px;color:var(--gold);text-shadow:0 1px 1px #000;direction:ltr}
.st s{text-decoration:none;color:#ffffff33}
.st em{color:#fff}
.st em{font-style:normal;font-weight:600;font-size:11px;margin-inline-start:3px;font-variant-numeric:tabular-nums}
.tag.on b{color:var(--gold)}
.pin{position:absolute;left:0;top:0;pointer-events:auto;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:var(--gold);border:3px solid #000;box-shadow:0 0 0 2px var(--gold);display:grid;place-items:center;color:#000;font-size:18px;line-height:1}
.pin::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--gold);animation:ping 2s ease-out infinite}
@keyframes ping{to{transform:scale(2.3);opacity:0}}
.pinl{position:absolute;left:0;top:0;pointer-events:none;direction:rtl;text-align:center;white-space:nowrap;
  font:400 15px/1 var(--display);color:var(--gold);text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.pinl small{display:block;font:600 10px/1.3 var(--body);color:#fff}
.radio{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);direction:rtl;
  background:#000c;padding:6px 14px;display:flex;gap:10px;align-items:center;font:400 18px/1 var(--display);white-space:nowrap;pointer-events:none}
.radio span{color:var(--gold)}
.eq{display:flex;gap:2px;align-items:flex-end;height:15px}
.eq i{width:3px;height:30%;background:var(--health)}
.eq i{transition:height .06s linear}
.blip{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid #000;display:grid;place-items:center;
  font:400 15px/1 system-ui,sans-serif;color:#000;pointer-events:auto;box-shadow:0 1px 3px #000;padding:0}
.blip.sch{background:#f3f0e6;border-color:#5a3fc0}
.blip.am{background:#f3f0e6;display:none}
.bn.key{color:#000;background:var(--gold)}
.map.am-on .blip.am{display:grid}
.blip.on,.blip.flash{outline:3px solid var(--gold);outline-offset:1px;z-index:3}
.bn{position:absolute;left:0;top:0;pointer-events:none;direction:rtl;white-space:nowrap;font:600 11px/1.2 var(--body);color:#fff;background:#0a1115c4;padding:1px 4px}
.bn.am{display:none}
.map.am-on .bn.am{display:block}
.map.lowzoom .bn{display:none!important}
.bn.hide{visibility:hidden}
.map.am-on .tag,.map.am-on .lead{opacity:.28}
.map.am-on .tag{pointer-events:none}
#amlines{display:none}
.map.am-on #amlines{display:block}
.amline{stroke:var(--gold);stroke-width:1;stroke-dasharray:3 4;opacity:.65;vector-effect:non-scaling-stroke}
.row .gl{width:26px;height:26px;border-radius:50%;background:#f3f0e6;border:2px solid #000;display:grid;place-items:center;font:400 14px/1 system-ui,sans-serif;color:#000}
.row .gl.s{border-color:#5a3fc0}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.keyc{background:#000;padding:10px;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:right}
.keyc i{font-style:normal;font-size:20px;line-height:1}
.keyc b{font:400 26px/1.1 var(--display);color:var(--gold)}
.keyc span{font-size:12.5px;color:var(--dim)}
.keyc.main{grid-column:1/-1;border-inline-start:4px solid var(--gold)}
.row.amr{grid-template-columns:26px minmax(0,1fr) auto}
.row.amr span:nth-child(2){font:600 15px/1.3 var(--body)}
.row.amr .km{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.rk b{font:400 22px/1 var(--display);color:var(--gold)}
.rk .num{font-size:15px}
.big{font:400 30px/1.1 var(--display);color:var(--ink)}
.cta{background:var(--gold);color:#000;font:400 18px/1 var(--display);padding:10px 12px;text-align:center;border:2px solid #000;width:100%}
.zone{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:14px;font:400 clamp(34px,6vw,64px)/1 var(--display);direction:rtl;
  color:var(--gold);pointer-events:none;opacity:0;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000}
.zone.show{animation:zone 2.8s ease-out}
@keyframes zone{0%{opacity:0;transform:translateX(24px)}10%,75%{opacity:1;transform:none}100%{opacity:0}}
.ctl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:center}
.ctl button{width:36px;height:36px;background:#000b;border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.north{font:400 15px/1 var(--display);text-align:center;color:var(--ink);margin-bottom:2px}
.north svg{width:22px;height:26px;display:block;margin:auto}
.scale{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:11px;color:var(--ink);pointer-events:none;direction:rtl;text-align:center}
.scale i{display:block;height:5px;border:1px solid var(--ink);border-top:0;margin-top:2px}
.sound{position:absolute;bottom:14px;right:max(16px,env(safe-area-inset-right,0px));direction:rtl;background:var(--gold);color:#000;
  font:400 19px/1 var(--display);padding:10px 18px;white-space:nowrap;border:2px solid #000;box-shadow:0 3px 0 #000}
.mute.off{color:var(--wasted)}
.sheet{background:var(--sheet);border-inline-end:2px solid #000;overflow-y:auto;direction:rtl;
  padding-block:16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.6}
.sheet h1,.sheet h2{font:400 34px/1.05 var(--display);margin:0;color:var(--gold);text-wrap:balance}
.sheet h3{font:400 20px/1.1 var(--display);margin:0 0 6px;color:var(--ink)}
.sheet p{margin:0;max-width:62ch}
.mut{color:var(--dim);font-size:12.5px}
.back{align-self:flex-start;font-weight:600;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.meter .bar{width:100%;height:12px;margin:0}
.meter .st{font-size:19px;direction:ltr;text-align:right;text-shadow:none;line-height:1}
.num{font-weight:600;font-variant-numeric:tabular-nums}
blockquote{margin:0;padding:10px 12px;background:#000;border-inline-start:4px solid var(--gold);font-size:14.5px}
blockquote small{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--sheet);padding:7px 10px;min-width:0}
.stats dt{color:var(--dim);font-size:12px}
.stats dd{margin:0;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
dl{margin:0}
.sec{display:grid;grid-template-columns:62px 1fr 44px;gap:4px 8px;align-items:center;font-size:13px}
.sec u{display:block;height:9px;background:#000;text-decoration:none;direction:rtl}
.sec u i{display:block;height:100%;background:var(--road)}
.warn{font-size:12.5px;color:var(--t3)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);text-align:right;width:100%}
.row:hover{background:#ffffff0d}
.row span:first-child{font:400 18px/1.1 var(--display)}
.row .bar{margin:0}
.row .st{font-size:12px}
.facts{display:flex;gap:18px;flex-wrap:wrap}
.facts div{min-width:0}
.facts strong{display:block;font:400 24px/1.1 var(--display);color:var(--ink)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 44%}
  .sheet{border-inline-end:0;border-top:2px solid #000;padding-block:12px 16px;gap:11px}
  .sheet h1,.sheet h2{font-size:28px}
  .tag{padding:2px 3px}.tag b{font-size:13px}.tag .bar{width:38px;height:4px}.tag .st{font-size:9px}.tag .st s{display:none}.tag .st em{font-size:9.5px}
  .pin{width:24px;height:24px;margin:-12px 0 0 -12px;font-size:12px;border-width:2px}
  .pinl{font-size:11px}.pinl small{display:none}
  .blip{width:24px;height:24px;margin:-12px 0 0 -12px;font-size:13px}
  .row{grid-template-columns:minmax(0,1fr) 64px auto}
  .row .bar{width:64px}.row .st{font-size:12px}
  .radio{font-size:15px;padding:5px 10px}
  .sound{right:max(10px,env(safe-area-inset-right,0px));bottom:10px;font-size:15px;padding:7px 12px}
  .scale{bottom:8px}
  .zone{bottom:8px}
}
@media (prefers-reduced-motion:reduce){.pin::after{animation:none}.zone.show{animation-duration:.01s}}
</style>

<div class="app">
  <main class="map" id="map" aria-label="خريطة أحياء شرق الرياض">
    <svg id="svg" aria-hidden="true"><defs id="defs"></defs><g id="world"><g id="gridg"></g><g id="turfs"></g><g id="leads"></g><g id="amlines"></g></g></svg>
    <div class="tags" id="tags"></div>
    <div class="radio" id="radio"><div class="eq"><i></i><i></i><i></i></div><div id="radioText">اختر حيًا لسماع أغنيته</div></div>
    <div class="ctl">
      <div class="north" aria-label="الشمال"><svg viewBox="0 0 22 26"><path d="M11 0l8 24-8-5-8 5z" fill="#eef1ec" stroke="#000"/></svg>ش</div>
      <button id="zi" aria-label="تكبير الخريطة">+</button>
      <button id="zo" aria-label="تصغير الخريطة">−</button>
      <button id="zr" aria-label="إظهار كل الأحياء">⌂</button>
      <button id="mute" class="mute" aria-label="كتم الصوت">♪</button>
    </div>
    <div class="scale" id="scale"><span id="scaleT">5 كم</span><i id="scaleB"></i></div>
    <button class="sound" id="sound" hidden>شغّل الصوت</button>
    <div class="zone" id="zone" aria-hidden="true"></div>
  </main>
  <aside class="sheet" id="sheet" aria-live="polite"></aside>
</div>

/* Audio: Web Audio with a checked signal, so a blocked or silent start is detected and offered a one-tap fix. */
const AC=window.AudioContext||window.webkitAudioContext;

function raw(n){const s=atob(SONG_DATA[n]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function boot(){if(ctx||!AC)return;try{ctx=new AC();master=ctx.createGain();an=ctx.createAnalyser();an.fftSize=1024;an.connect(master);master.connect(ctx.destination);master.gain.value=soundOn?1:0;
  ctx.onstatechange=()=>{ui();if(ctx&&ctx.state==='running')start()};try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch{}}catch{ctx=null}}
function poke(){boot();if(ctx&&ctx.state==='running')return start();

    const r=ctx.resume();if(r&&r.then)r.then(start,ui)}else start();ui()}
['pointerup','touchend','mousedown','keydown','click'].forEach(e=>addEventListener(e,poke,{capture:true,passive:true}));

  if(htmlA){htmlA.pause();htmlA=null}}

async function start(){const n=want;
  if(!n||(cur&&cur.n===n)||(htmlA&&htmlN===n)){ui();return}
  if(!ctx){if(!AC){halt();viaTag(n,token)}ui();return}
  if(ctx.state!=='running'){ui();return}
  halt();const t=token;let b;
  try{b=await getBuf(n)}catch{viaTag(n,t);return}
  if(t!==token||want!==n)return;
  const src=ctx.createBufferSource(),g=ctx.createGain(),at=ctx.currentTime;src.buffer=b;src.loop=true;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(1,at+.25);src.connect(g);g.connect(an);src.start();
  cur={n,src,g};heard=false;silent=false;ui();

(function meter(){requestAnimationFrame(meter);if(!an||!cur){bars.forEach(b=>b.style.height='20%');return}
